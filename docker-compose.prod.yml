services:
  ai-conding-github:
    image: ai-conding-github:${IMAGE_TAG:-latest}
    container_name: ai-conding-github
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    networks:
      - default
      - ai-coding_default

networks:
  ai-coding_default:
    external: true
